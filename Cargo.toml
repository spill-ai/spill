[package]
name = "spill"
version = "0.1.0"
edition = "2021"
description = "Keep large MCP tool results out of the context window"
repository = "https://github.com/spill-ai/spill"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
duckdb = { version = "=1.4.2", features = ["bundled"] }
rmcp = { version = "0.8.5", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
sqlparser = "0.59"
toml_edit = "0.25"

[profile.release]
lto = "thin"
strip = true
