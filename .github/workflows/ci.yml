name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 scripts/smoke.py target/debug/spill

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the checked-out tap
        run: brew tap spill-ai/spill "$GITHUB_WORKSPACE"
      - name: Build the stable formula
        run: brew install --build-from-source spill-ai/spill/spill
      - name: Exercise the installed binary
        run: brew test spill-ai/spill/spill

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.43/mdbook-v0.4.43-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=/usr/local/bin
      - name: Build book
        run: mdbook build
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
